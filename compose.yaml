name: finance-platform

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
  env_file:
    - .env
  environment:
    APP_ENV: ${APP_ENV:-development}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    APP_SECRET_KEY: ${APP_SECRET_KEY:-local-development-only-change-me}
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://platform:platform-local-only@postgres:5432/platform}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
    TELEGRAM_ADAPTER: ${TELEGRAM_ADAPTER:-fake}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"

  bot:
    <<: *backend
    command: ["python", "apps/finance-bot/main.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "services.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
